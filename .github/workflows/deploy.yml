name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up node.js
        uses: actions/setup-node@4
        with:
          node-version: 20
          cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Angular Application
      run: npm run build -- --base-href=/

    - name: Configure Custom Domain and Routing Fallbacks
      run: |
        echo "johnnieh.me" > dist/profilepage/browser/CNAME
        cp dist/profilepage/browser.index.html dist/profilepage/browser/404.html

    - name: Upload Artifacts
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist/profilepage/browser'

    - name: Deploy to Github Pages
      id: deployment
      uses: actions/deploy-pages@v4